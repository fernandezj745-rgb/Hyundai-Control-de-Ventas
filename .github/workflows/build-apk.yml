name: Construir APK Hyundai Control de Ventas

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          
      - name: Compilar APK
        run: |
          ./gradle-8.9/bin/gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hyundai-Control-de-Ventas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
